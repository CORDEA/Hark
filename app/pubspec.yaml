name: hark
description: "Hark on-call notification client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  flutter_hooks: ^0.21.3+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  app_links: ^7.2.1
  flutter_local_notifications: ^22.0.1
  google_fonts: ^8.2.0
  logger: ^2.7.0
  passkeys: ^2.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
