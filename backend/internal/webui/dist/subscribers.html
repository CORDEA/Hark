<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hark Admin · Subscribers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --n-0:#0a0a0b; --n-1:#0e0e10; --n-2:#151517; --n-3:#17171a;
      --n-4:#1c1c1f; --n-5:#232326; --n-6:#2a2a2e; --n-7:#3a3a3e;
      --text-1:#f4f4f5; --text-2:#e4e4e7; --text-3:#c8c8ce;
      --text-4:#9a9aa0; --text-5:#8a8a90; --text-6:#6b6b70;
      --red-9:oklch(75% 0.21 25); --red-7:oklch(70% 0.21 25); --red-6:oklch(63% 0.21 25);
      --red-border-strong:#3a2020; --red-text-muted:#c8898a;
      --green-text:#7fd996; --green-bg:#152a1a; --green-border:#1e4028;
      --blue-9:oklch(75% 0.15 240); --blue-7:oklch(70% 0.12 240);
    }
    html, body { background: var(--n-0); color: var(--text-1); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--blue-7); text-decoration: none; }
    a:hover { color: var(--blue-9); }
    ::selection { background: oklch(63% 0.21 25 / 0.35); color: #fff; }
    .mono { font-family: ui-monospace, Menlo, monospace; }
    .badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
             font-size:11px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; }
    .badge-active  { background:var(--green-bg); color:var(--green-text); border:1px solid var(--green-border); }
    .badge-invited { background:var(--n-5); color:var(--text-4); }
    .modal-backdrop { background: rgba(0,0,0,0.6); }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:var(--n-6); border-radius:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
  </style>
</head>
<body>
  <div class="max-w-[1180px] mx-auto px-10 pb-16">
    <div class="pt-9 pb-2">
      <a href="index.html" style="color:var(--text-5)" class="text-sm font-semibold" data-i18n="subscribers.backToDashboard">&larr; Dashboard</a>
    </div>
    <header class="flex items-end justify-between py-2 pb-7 border-b" style="border-color:var(--n-4)">
      <div>
        <div class="text-xs font-semibold uppercase tracking-widest" style="color:var(--text-5)" data-i18n="subscribers.eyebrow">Hark admin</div>
        <div class="text-3xl font-black tracking-tight mt-1" style="color:var(--text-1)" data-i18n="subscribers.title">Subscribers</div>
      </div>
      <div class="flex gap-7">
        <div class="text-right">
          <div class="text-[22px] font-extrabold" id="count-active" style="color:var(--text-1)">–</div>
          <div class="text-[11px] uppercase tracking-widest mt-0.5" style="color:var(--text-5)" data-i18n="subscribers.countActive">Active</div>
        </div>
        <div class="text-right">
          <div class="text-[22px] font-extrabold" id="count-invited" style="color:var(--text-1)">–</div>
          <div class="text-[11px] uppercase tracking-widest mt-0.5" style="color:var(--text-5)" data-i18n="subscribers.countInvited">Invited</div>
        </div>
      </div>
    </header>

    <section class="mt-7">
      <div class="flex items-center justify-between mb-3.5">
        <div class="text-xs" style="color:var(--text-5)" data-i18n="subscribers.description">Devices registered to receive on-call pages</div>
        <button id="btn-invite" type="button"
                class="h-11 px-5 rounded-lg font-semibold text-sm flex items-center gap-2"
                style="background:var(--n-3);border:1px solid var(--n-6);color:var(--text-2)">
          <span class="text-base leading-none">+</span> <span data-i18n="subscribers.inviteButton">Invite New User</span>
        </button>
      </div>

      <div id="invite-card" class="hidden mb-4 rounded-xl p-6"
           style="background:var(--n-2);border:1px solid var(--n-5)">
        <div class="grid gap-7 items-start" style="grid-template-columns:1fr 160px">
          <div class="flex flex-col gap-4 min-w-0">
            <div id="invite-card-title" class="text-sm font-bold" style="color:var(--text-1)" data-i18n="invite.cardTitle.newUser">Temporary join details</div>
            <div>
              <div class="text-xs font-semibold mb-1.5" style="color:var(--text-5)" data-i18n="invite.serverUrlLabel">Server URL</div>
              <div class="flex gap-2 items-stretch">
                <div id="invite-server-url" class="mono text-sm p-3 rounded-md break-all flex-1"
                     style="background:var(--n-3);border:1px solid var(--n-6);color:var(--text-2)">…</div>
                <button id="btn-copy-server" type="button"
                        class="rounded-md font-bold text-xs px-4 flex-shrink-0"
                        style="background:var(--n-4);border:1px solid var(--n-6);color:var(--text-2)"
                        data-i18n="invite.copy">Copy</button>
              </div>
            </div>
            <div>
              <div class="text-xs font-semibold mb-1.5" style="color:var(--text-5)" data-i18n="invite.invitationCodeLabel">Invitation code</div>
              <div class="flex gap-2 items-stretch">
                <div id="invite-code" class="mono text-sm p-3 rounded-md break-all flex-1"
                     style="background:var(--n-3);border:1px solid var(--n-6);color:var(--text-2)">…</div>
                <button id="btn-copy-code" type="button"
                        class="rounded-md font-bold text-xs px-4 flex-shrink-0"
                        style="background:var(--n-4);border:1px solid var(--n-6);color:var(--text-2)"
                        data-i18n="invite.copy">Copy</button>
              </div>
            </div>
            <div class="flex gap-2.5 pt-1">
              <button id="btn-invite-close" type="button"
                      class="h-10 px-4 rounded-md font-semibold text-xs"
                      style="background:transparent;border:1px solid var(--n-6);color:var(--text-4)" data-i18n="invite.done">Done</button>
            </div>
          </div>
          <div class="flex flex-col items-center gap-2">
            <img id="invite-qr" alt="Invite QR code" data-i18n-attr="alt:invite.qrAlt" width="160" height="160"
                 class="rounded-md" style="background:#fff">
            <button id="btn-download-qr" type="button"
                    class="w-full h-9 px-3 rounded-md font-semibold text-xs"
                    style="background:var(--n-4);border:1px solid var(--n-6);color:var(--text-2)"
                    data-i18n="invite.downloadQr">Download QR</button>
          </div>
        </div>
      </div>

      <div id="rows" class="rounded-xl overflow-hidden" style="background:var(--n-2);border:1px solid var(--n-5)"></div>
    </section>
  </div>

  <!-- Invite modal -->
  <div id="invite-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-6 modal-backdrop">
    <div class="w-full max-w-[420px] rounded-xl p-7"
         style="background:var(--n-2);border:1px solid var(--n-5)">
      <div class="text-2xl font-extrabold" style="color:var(--text-1)" data-i18n="invite.modal.title">Invite new user</div>
      <div class="text-xs mt-1 mb-5" style="color:var(--text-5)" data-i18n="invite.modal.subtitle">Give this subscriber a display name so responders can tell devices apart.</div>

      <form id="invite-form" novalidate>
        <label for="invite-name" class="text-[11px] font-bold uppercase tracking-widest mb-1.5 block" style="color:var(--text-5)" data-i18n="invite.modal.displayNameLabel">Display name</label>
        <input id="invite-name" name="displayName" type="text" autocomplete="off" maxlength="80"
               placeholder="e.g. Jordan Marsh"
               data-i18n-attr="placeholder:invite.modal.displayNamePlaceholder"
               class="w-full h-11 px-3 rounded-md text-sm outline-none"
               style="background:var(--n-3);border:1px solid var(--n-6);color:var(--text-1)">
        <div id="invite-error" class="text-xs mt-2 hidden" style="color:var(--red-9)"></div>

        <div class="flex gap-2.5 mt-6">
          <button id="invite-create" type="submit"
                  class="flex-1 rounded-lg font-bold text-base"
                  style="background:var(--red-6);color:#fff;height:48px" data-i18n="invite.modal.create">Create invite</button>
          <button id="invite-cancel" type="button"
                  class="px-5 rounded-lg font-semibold text-sm"
                  style="background:transparent;border:1px solid var(--n-6);color:var(--text-4);height:48px" data-i18n="invite.modal.cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="subscribers.js"></script>
</body>
</html>
